name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So the site can be re-published without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The site only ships if it type-checks and the clocks still tell the
      # right time.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
