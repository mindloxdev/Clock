name: Build and publish

on:
  push:
    branches: [main]
  # So the site can be re-published without a code change.
  workflow_dispatch:

# Only what publishing needs: push the built site to the `gh-pages` branch.
permissions:
  contents: write

# Let a running publish finish rather than cancelling it half-written.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The site only ships if it type-checks and the clocks still tell the
      # right time.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Pages serves this repository from the `gh-pages` branch, so the built
      # site is pushed there as a single flat commit. Switching to the Actions
      # deployment instead would mean changing the repository's Pages source,
      # which needs admin rights the workflow token does not have.
      - name: Publish to gh-pages
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
